# Nginx reverse proxy для лендинга (Vite/serve на порту 4173)
#
# Как работает:
# - Nginx принимает запросы на 80 порт
# - Прокидывает их на локальный сервис лендинга: 127.0.0.1:4173
#
# Важно:
# - certbot/HTTPS настраивается отдельно (обычно certbot сам добавляет блоки ssl в Nginx).
# - Переменные в конфиге не используются — можно сразу включать/тестировать.
#
# Подходит когда ваш лендинг работает по IP: http://64.188.61.44:4173/
# (на сервере это всё равно будет 127.0.0.1:4173, потому что прокси держит связь внутри сервера)

server {
    listen 80;
    listen [::]:80;

    # Принимаем запросы по любому домену/hostname.
    # Если хотите строго под конкретный домен — замените "_" на "sawyercrypto.com www.sawyercrypto.com".
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:4173;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Чтобы страницы и SPA отдавались без задержек буферизации
        proxy_buffering off;
    }
}

